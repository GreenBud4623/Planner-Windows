name: Build Windows app

# On every push: builds Planner-Setup.exe and Planner-Portable.exe and publishes them on the Releases page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Planner for Windows (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **Planner-Setup.exe** and run it (or **Planner-Portable.exe** to run it without installing).
            If Windows shows "Windows protected your PC", click **More info → Run anyway**.
            Updating installs over the old version and keeps your tasks.
          files: |
            dist/Planner-Setup.exe
            dist/Planner-Portable.exe
